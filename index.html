<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Fenix Distribuidora e Logística · Gestão</title>
    <link rel="icon" type="image/webp" href="/logo-round.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Saira:ital,wght@0,500;0,700;0,800;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* aplica o tema salvo antes da primeira pintura (evita piscar) */
      try {
        var t = localStorage.getItem('fenix_tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
